name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up NVC
        uses: nickg/setup-nvc@v1

      - name: Run VUnit tests with Code Coverage
        id: test_run
        run: |
          VUNIT_SIMULATOR=nvc uv run python run.py -x vunit_out/xunit.xml --coverage
        continue-on-error: true

      - name: Update README table and shields
        if: steps.test_run.outcome == 'success' && hashFiles('vunit_out/xunit.xml') != ''
        run: |
          uv run python scripts/update_readme.py vunit_out/xunit.xml

      - name: Commit and push README update
        if: steps.test_run.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: update test results and shields in README [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Verify wavedisp waveform descriptions
        run: |
          uv run python scripts/generate_waves.py --check-all

      - name: Upload Test & Coverage Artifacts
        if: always() && hashFiles('vunit_out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vunit-test-and-coverage-results
          path: |
            vunit_out/xunit.xml
            vunit_out/coverage/html/
            vunit_out/coverage/cobertura.xml
            vunit_out/coverage/coverage_badge.svg

      - name: Verify test success
        if: always() && steps.test_run.outcome != 'success'
        run: |
          echo "::error::VUnit test suite failed."
          exit 1
